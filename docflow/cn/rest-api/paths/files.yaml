              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - $ref: '../components/schemas/files.yaml#/TaskProcessResult'

/api/app-api/sip/platform/v2/file/fetch:
  get:
    summary: 获取文件处理结果列表
    description: |
      查询任务的识别结果。任务已有翻译结果时，接口保留原始识别字段，并在对应对象中追加译文：
      - 普通字段及旧版单表字段：`data.fields[]`、`data.items[][]`中的`translated_key`、`translated_value`
      - 多表结果：`data.tables[]`中的`translated_table_name`，以及`data.tables[].items[][]`中的`translated_key`、`translated_value`
      - 印章：`data.stamps[]`中的`translated_color`、`translated_text`、`translated_shape`、`translated_type`
      - 手写体：`data.handwritings[]`中的`translated_text`

      翻译字段仅在对应内容存在译文时有值，不会覆盖原始的`key`、`value`、`tableName`等字段。
    operationId: getFiles
    parameters:
      - name: page
        in: query
        description: 页码，默认1
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: 每页数量，默认1000
        required: false
        schema:
          type: integer
          default: 1000
      - name: workspace_id
        in: query
        description: 空间ID
        required: true
        schema:
          type: string
      - name: batch_number
        in: query
        description: 批次编号
        required: false
        schema:
          type: string
      - name: file_id
        in: query
        description: 文件ID
        required: false
        schema:
          type: string
      - name: task_id
        in: query
        description: 任务ID。按任务精确查询时传入，雪花ID需使用字符串，避免精度丢失。
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: 文件类别
        required: false
        schema:
          type: string
      - name: recognition_status
        in: query
        required: false
        schema:
          $ref: '../components/schemas/common.yaml#/RecognitionStatus'
      - name: verification_status
        in: query
        description: "文件核对状态 0: 待核对 2: 已确认 3: 已拒绝 4: 已删除 5: 推迟处理"
        required: false
        schema:
          $ref: '../components/schemas/common.yaml#/VerificationStatus'
      - name: start_time
        in: query
        description: 以更新时间搜索的开始时间, RFC3339格式(YYYY-MM-DDTHH:MM:SSZ)
        required: false
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - name: end_time
        in: query
        description: 以更新时间搜索的结束时间, RFC3339格式(YYYY-MM-DDTHH:MM:SSZ)
        required: false
        schema:
          type: string
          format: date-time
          example: 2024-01-01T10:00:00Z
      - name: with_document
        in: query
        description: 是否返回文档的全部文字识别结果
        required: false
        schema:
          type: boolean
          default: false
      - name: with_task_detail_url
        in: query
        description: 是否返回任务详情页URL
        required: false
        schema:
          type: boolean
          default: false
      - name: with_image_url
        in: query
        description: |
          是否返回每页图片URL，默认`false`。
          开启后，普通任务或父任务的`files[].pages[]`，以及拆套或切图子任务的
          `files[].child_files[].pages[]`都会返回对应任务自身的`image_url`。
          图片URL与同一页面对象中的`page`、`angle`、`width`、`height`按页面索引一一对应；
          链接有效期为30天。图片尚未生成或URL不可用时返回`null`。关闭或不传时不输出`image_url`字段。
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: 成功获取文件列表
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - $ref: '../components/schemas/files.yaml#/TaskProcessResult'

/api/app-api/sip/platform/v2/file/translate:
  post:
    summary: 翻译文件抽取结果
    description: |
      语言使用 ISO 639-1 编码，中文按地区区分为`zh-CN`和`zh-TW`。
      `source_language`省略或传空字符串时自动检测源语言；指定源语言时不能与`target_language`相同。
      调用接口后执行翻译并同步开启前端详情展示。并发请求会返回“任务正在翻译中，请稍后重试”。

      常见业务错误码：
      - `1005025070`：任务识别失败，无法执行翻译
      - `1005025071`：任务尚未完成识别
      - `1005025072`：任务正在翻译中
      - `1005025073`：翻译源语言和目标语言相同
      - `1020005001`：源语言或目标语言为空、不支持或不是有效语言编码
    operationId: translateFile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/files.yaml#/FileTranslateRequest'
          example:
            task_id: "202412190001"
            source_language: ""
            target_language: zh-CN
    responses:
      '200':
        description: 翻译请求处理完成；具体结果以响应中的业务code为准
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/CodeMessage'
                - $ref: '../components/schemas/files.yaml#/FileTranslateResult'

/api/app-api/sip/platform/v2/file/delete:
  post:
    summary: 删除任务
    description: 按条件删除文件，满足任一条件即可删除。
    operationId: deleteFile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                description: 空间ID
                example: 1234567890
              batch_number:
                type: array
                items:
                  type: string
                description: 批次编号列表
                example: ["202412190001", "202412190002"]
              task_id:
                type: array
                items:
                  type: string
                description: 任务ID列表
                example: ["1978297791713619968", "1978297791713619969"]
              file_id:
                type: array
                items:
                  type: string
                description: 文件ID列表
                example: ["1978297792124661760", "1978297792124661761"]
              start_time:
                type: integer
                description: 开始时间（epoch时间戳，单位：秒）
                example: 1760523600
              end_time:
                type: integer
                description: 结束时间(epoch时间戳，单位：秒)
                example: 1760523600
            required:
              - workspace_id
    responses:
      '200':
        description: 成功删除任务
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/CodeMessage'
                - type: object
                  properties:
                    result:
                      type: object
                      properties:
                        deleted_count:
                          type: integer
                          description: 删除的文件数量
                          example: 1

/api/app-api/sip/platform/v2/file/update:
  post:
    summary: 更新文件处理结果
    description: 更新文件处理结果。通常用于人工审核校对后，上传修改后的key-value，覆盖自动识别的结果。
    operationId: updateFile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                workspace_id:
                  type: string
                  description: 空间ID
                  example: 1234567890
                file_id:
                  type: string
                  description: 文件ID
                  example: 202412190001
                data:
                  description: |
                    全量更新字段。  
                    注意，即使只更新部分字段，也必须包含所有字段。  
                    如果传入的字段较原字段多，则多出的字段会被添加。  
                    如果传入的字段较原字段少，则缺少的字段会被删除。  
                    如果传入的字段值较原字段值有变化，则字段值会被更新。  
                    如果传入的字段与原字段完全相同，则字段会被保留。
                  type: object
                  properties:
                    fields:
                      type: array
                      items:
                        $ref: '../components/schemas/files.yaml#/KeyValue'
                      example:
                      - key: 发票代码
                        value: "3100231130"
                        position:
                        - page: 0
                          vertices: [0, 0, 100, 0, 100, 100, 0, 100]
                      - key: 发票号码
                        value: "28737000"
                        position:
                        - page: 0
                          vertices: [0, 0, 100, 0, 100, 100, 0, 100]
                    items:
                      type: array
                      items:
                        type: array
                        items:
                          $ref: '../components/schemas/files.yaml#/KeyValue'
                      example:
                      - - key: 货物劳务名称
                          value: ＊电子计算机＊微型计算机主机
                          position:
                          - page: 0
                            vertices: [0, 0, 100, 0, 100, 100, 0, 100]
                        - key: 规格型号
                          value: DMS-SC68
                          position:
                          - page: 0
                            vertices: [0, 0, 100, 0, 100, 100, 0, 100]
                      - - key: 货物劳务名称
                          value: ＊机械计算机＊巨型计算机主机
                          position:
                          - page: 0
                            vertices: [0, 0, 100, 0, 100, 100, 0, 100]
                        - key: 规格型号
                          value: AN/FSQ-7
                          position:
                          - page: 0
                            vertices: [0, 0, 100, 0, 100, 100, 0, 100]
              required:
              - workspace_id
              - file_id
              - data
    responses:
      '200':
        description: 成功更新文件处理结果
        content:
          application/json:
            schema:
              allOf:
              - $ref: '../components/schemas/common.yaml#/CodeMessage'
              - type: object
                properties:
                  result:
                    type: object
                    properties:
                      files:
                        description: 更新后的文件列表
                        type: array
                        items:
                          type: object
                          properties:
                            workspace_id:
                              type: string
                              description: 空间ID
                              example: 1234567890
                            id:
                              type: string
                              description: 文件ID
                              example: 202412190001
    x-codeSamples:
      - lang: 'bash'
        label: cURL
        source: | 
          curl -X POST \
          -H 'x-ti-app-id: 1234567890' \
          -H 'x-ti-secret-code: 1234567890' \
          -d '[{"workspace_id": "1234567890", "file_id": "202412190001", "data": {"fields": [{"key": "发票代码", "value": "3100231130"}]}}]' \
          'https://docflow.textin.com/api/app-api/sip/platform/v2/file/update'

/api/app-api/sip/platform/v2/file/amend_category:
  post:
    summary: 修改文件类别
    description: |
      - 对于普通任务，修改普通任务文件类别
      - 对于文档拆分任务，修改拆分后的文件类型和页码
      - 对于多图切分任务，修改切分后的文件类型
    operationId: amendCategory
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                description: 空间ID
                example: 1234567890
              task_id:
                type: string
                description: 任务ID
                example: 1234567890
              category:
                type: string
                description: |
                  新文件类别。
                  只有当任务类型为普通任务时，才支持更新文件类别。
                example: 电子发票（普通发票）
              split_tasks:
                description: 文件拆分任务列表
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      description: 子任务文件类别
                      example: 电子发票（普通发票）
                    pages:
                      type: array
                      items:
                        type: integer
                        description: 子文件页码，从0开始计数
                      example: [0, 1]
              crop_tasks:
                description: 多图切分任务列表
                type: array
                items:
                  type: object
                  properties:
                    crop_child_task_id:
                      type: string
                      description: 多图切分子任务ID
                      example: 1234567890
                    category:
                      type: string
                      description: 子任务文件类别
                      example: 电子发票（普通发票）
            required:
              - workspace_id
              - task_id
    responses:
      '200':
        description: 成功更新文件类别
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/CodeMessage'

/api/app-api/sip/platform/v2/file/retry:
  post:
    summary: 重新处理文件
    description: 重新处理文件。
    operationId: retryFile
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                description: 空间ID
                example: 1234567890
              task_id:
                type: string
                description: 任务ID
                example: 1234567890
              parser_params:
                $ref: '../components/schemas/files.yaml#/DocumentParserParam'
            required:
              - workspace_id
              - task_id
    responses:
      '200':
        description: 成功重新处理文件
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/CodeMessage'

/api/app-api/sip/platform/v2/file/extract_fields:
  post:
    summary: 抽取特定字段
    description: |
      针对已经完成抽取的任务，为该任务抽取额外的字段，或重新抽取个别已有的字段。  
      返回所有字段的完整抽取结果。返回结构同`/api/app-api/sip/platform/v2/file/fetch`。
    operationId: extractFields
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              workspace_id:
                type: string
                description: 空间ID
                example: 1234567890
              task_id:
                type: string
                description: 任务ID
                example: 1234567890
              fields:
                type: array
                items:
                  $ref: '../components/schemas/files.yaml#/ExtractFieldReqVO'
              tables:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 表格名称
                      example: Table1
                    extract_model:
                      type: string
                      description: |
                        整表抽取模型，不填默认使用 Acgpt。表格内所有字段统一使用此模型
                        - Auto: 智能匹配抽取模型
                        - Acgpt: 速度快，抽取结果稳定
                        - Acgpt-VL: 多模态，适用简单抽取（≤10 页）
                        - DF-M1: 适用复杂文档理解
                      example: "Acgpt"
                      enum:
                        - Auto
                        - Acgpt
                        - Acgpt-VL
                        - DF-M1
                    fields:
                      type: array
                      items:
                        $ref: '../components/schemas/files.yaml#/ExtractFieldReqVO'
            required:
              - workspace_id
              - task_id
    responses:
      '200':
        description: 成功提取字段
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/CodeMessage'
                - $ref: '../components/schemas/files.yaml#/TaskProcessResult'
