SplitConfig:
  type: object
  description: Saved split configuration on success; null or omitted on failure.
  required:
  - workspace_id
  - scope
  - rule_mode
  - rule_order
  - constraint
  - llm_prompt_mode
  properties:
    workspace_id:
      type: string
      description: Workspace ID
      example: '2081651727503572992'
    scope:
      type: string
      description: 'Configuration scope: workspace or category.'
      enum:
      - workspace
      - category
    category_id:
      type: string
      nullable: true
      description: Category ID; returned for category scope
    rule_mode:
      type: string
      description: 'Rule source: workspaces support default (system defaults) or custom; categories support inherit
        (follow the workspace) or custom. An inheriting category uses workspace rules and prompts but retains its
        own constraint.'
      enum:
      - default
      - inherit
      - custom
    rule_order:
      type: array
      description: Rules saved for this scope, ordered from highest to lowest priority. Send an empty array for
        default/inherit. Custom mode accepts 0–7 unique rules. Inherited workspace rules are not expanded here.
      items:
        $ref: '#/SplitRule'
    constraint:
      type: string
      description: 'Category constraint: none; strict_single_page (single-page documents); strict_multi_page (multi-page
        documents); strict_once (one document in this category). Workspace scope only supports none.'
      enum:
      - none
      - strict_single_page
      - strict_multi_page
      - strict_once
    llm_prompt_mode:
      type: string
      description: 'Prompt source for the llm_judge rule: default uses the system prompt; custom uses llm_prompt.
        This setting is not a split rule.'
      enum:
      - default
      - custom
    llm_prompt:
      type: string
      nullable: true
      description: 'Custom instructions for llm_judge, for example: use titles and context to decide whether adjacent
        pages belong to the same document. Must be nonblank when this rule is enabled and llm_prompt_mode=custom.
        Omitted when not configured.'
  nullable: true
SplitRule:
  type: string
  enum:
  - page_same
  - page_reset
  - invoice_diff
  - invoice_same
  - page_seq
  - table_continue
  - llm_judge
  description: Split rule code. llm_judge asks the model to judge page continuity; configure its prompt with llm_prompt_mode
    and llm_prompt.
SplitConfigUpdateRequest:
  type: object
  required:
  - workspace_id
  - scope
  - rule_mode
  - rule_order
  properties:
    workspace_id:
      type: string
      description: Workspace ID. Requires WORKSPACE_CONFIG permission and access to this workspace.
    scope:
      type: string
      enum:
      - workspace
      - category
      description: 'Configuration scope: workspace or category. When scope is category, category_id is required.'
    category_id:
      type: string
      description: Required for category scope and must belong to the specified workspace. Omit for workspace scope.
    rule_mode:
      type: string
      description: 'Rule source: workspaces support default (system defaults) or custom; categories support inherit
        (follow the workspace) or custom. An inheriting category uses workspace rules and prompts but retains its
        own constraint.'
      enum:
      - default
      - inherit
      - custom
    rule_order:
      type: array
      description: Rules saved for this scope, ordered from highest to lowest priority. Send an empty array for
        default/inherit. Custom mode accepts 0–7 unique rules. Inherited workspace rules are not expanded here.
      maxItems: 7
      uniqueItems: true
      items:
        $ref: '#/SplitRule'
    constraint:
      type: string
      default: none
      enum:
      - none
      - strict_single_page
      - strict_multi_page
      - strict_once
      description: 'Category constraint: none; strict_single_page (single-page documents); strict_multi_page (multi-page
        documents); strict_once (one document in this category). Workspace scope only supports none.'
    llm_prompt_mode:
      type: string
      default: default
      enum:
      - default
      - custom
      description: 'Prompt source for the llm_judge rule: default uses the system prompt; custom uses llm_prompt.
        This setting is not a split rule.'
    llm_prompt:
      type: string
      nullable: true
      description: 'Custom instructions for llm_judge, for example: use titles and context to decide whether adjacent
        pages belong to the same document. Must be nonblank when this rule is enabled and llm_prompt_mode=custom.'
SplitConfigError:
  type: object
  required:
  - code
  - msg
  - result
  properties:
    code:
      type: integer
      format: int64
      description: Business error code. Use this field to identify the error type.
    msg:
      type: string
      description: Localized explanation of the error. See response examples for each error code.
    result:
      type: object
      nullable: true
      enum:
      - null
      example: null
      description: Null when the request fails.
SplitConfigResponse:
  type: object
  additionalProperties: true
  required:
  - code
  - msg
  properties:
    code:
      type: integer
      format: int64
      description: 'Business status code: 200 indicates success; other values indicate failure.'
      example: 200
    msg:
      type: string
      description: Response message; explains the reason when the request fails.
      example: success
    result:
      $ref: '#/SplitConfig'
