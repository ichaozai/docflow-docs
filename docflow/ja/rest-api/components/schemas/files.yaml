TextInLines:
  type: object
  properties:
    angle:
      type: string
      description: 角度
      example: 0
    pos:
      type: array
      description: 座標
      items:
        type: integer
        description: 座標
        example: 1
    page:
      type: integer
      description: ページ番号
      example: 1
    text:
      type: string
      description: テキスト
      example: テキスト内容
    char_pos:
      type: array
      description: 文字座標
      items:
        type: array
        description: 文字座標
        items:
          type: integer
          description: 文字座標
          example: 1
  description: フィールド座標

TaskType:
  type: integer
  description: |
    タスクタイプ
    - 0: **ファイル分割サブタスク**: 「ファイル分割」スイッチを有効にしたファイルタスクが正常に実行されると、そのファイルバッチタスク内のファイル分割操作で生成されたサブタスクは分割サブタスクとなり、ファイルカテゴリ配下の実際のファイルセット数に応じて分割されます
    - 1: **通常タスク**: 「ファイル分割」および「複数画像クロップ」スイッチが有効でないファイルタスク
    - 2: **親タスク**: 「ファイル分割」または「複数画像クロップ」スイッチを有効にしたファイルタスクの実行後、そのファイルバッチタスク内の各ファイルは親タスクになります
    - 3: **クロップサブタスク**: 「複数画像クロップ」スイッチを有効にしたファイルタスクが正常に実行されると、そのファイルバッチタスク内の複数画像クロップ操作で生成されたサブタスクはクロップサブタスクとなり、ファイルカテゴリ配下の実際のクロップ結果数に応じて分割されます
  example: 1

PagesInfo:
  type: array
  description: |
    ファイルの各ページをレンダリングするためのデータ。data.fields の page および position フィールドと組み合わせることで、ページ上のフィールド位置を正確に描画できます。
  items:
    type: object
    properties:
      page:
        type: integer
        description: ページ番号。0 から開始
        example: 1
      angle:
        type: integer
        description: 回転角度
        enum:
          - 0
          - 90
          - 180
          - 270
      width:
        type: integer
        description: 補正後のページ幅
        example: 1024
      height:
        type: integer
        description: 補正後のページ高さ
        example: 1024
      dpi:
        type: integer
        description: PDF を画像に変換する際の解像度。PDF 以外のファイルでは、この値は 0 です。
        example: 144
      image_url:
        type: string
        format: uri
        nullable: true
        description: |
          現在のタスクにおけるこのページの画像 URL。`with_image_url=true` の場合のみ返されます。
          通常/親タスクと分割/画像切り出し子タスクは、それぞれ自身のページ画像を返します。
          URL は同じオブジェクトの `page`、`angle`、`width`、`height` とページインデックスで対応します。
          画像が未生成、URL が空、またはページ情報が範囲外の場合は `null` です。
          URL の有効期間は30日です。オプションが無効な場合、このフィールドは出力されません。
        example: https://example.com/pages/202412190001/0.png

FileTranslateRequest:
  type: object
  required: [task_id, target_language]
  properties:
    task_id:
      type: string
      description: 認識が完了したタスクの ID。Snowflake ID は文字列として送信し、JavaScript Number に変換しないでください。
      example: "1978297791713619968"
    source_language: { $ref: '#/TranslateSourceLanguage' }
    target_language: { $ref: '#/TranslateTargetLanguage' }

FileTranslateResult:
  type: object
  properties:
    result:
      type: object
      required: [fields, tables, stamps, handwritings]
      properties:
        fields:
          type: array
          description: 通常フィールドの翻訳結果
          items: { $ref: '#/CommonFieldTranslate' }
        tables:
          type: array
          description: テーブルの翻訳結果
          items: { $ref: '#/TableDetailTranslate' }
        stamps:
          type: array
          description: 印影の翻訳結果
          items: { $ref: '#/StampTranslateResult' }
        handwritings:
          type: array
          description: 手書き文字の翻訳結果
          items: { $ref: '#/HandwritingTranslateResult' }

TranslateSourceLanguage:
  type: string
  description: ISO 639-1 コードの翻訳元言語。省略または空文字列の場合は自動検出します。
  enum: ["", zh-CN, zh-TW, ja, ko, en, fr, pt, de, it, es, ru, th, vi, ms, id, hi, bn, ar, pl]
  example: ""

TranslateTargetLanguage:
  type: string
  description: 必須の翻訳先言語。具体的な ISO 639-1 コードを指定してください。
  enum: [zh-CN, zh-TW, ja, ko, en, fr, pt, de, it, es, ru, th, vi, ms, id, hi, bn, ar, pl]
  example: zh-CN

CommonFieldTranslate:
  type: object
  properties:
    key: { type: string, description: 元のフィールド key, example: invoiceNumber }
    translated_key: { type: string, nullable: true, description: フィールド key の翻訳結果。通常、テーブルセルでは使用しません }
    index: { type: integer, description: 同じ key を持つフィールドの0始まりインデックス, example: 0 }
    value: { type: string, nullable: true, description: フィールド値の翻訳結果 }

TableFieldHeadTranslate:
  type: object
  properties:
    key: { type: string, description: 元のヘッダー key }
    translated_key: { type: string, nullable: true, description: ヘッダー key の翻訳結果 }

TableDetailTranslate:
  type: object
  properties:
    table_name: { type: string, description: 元のテーブル名 }
    translated_table_name: { type: string, nullable: true, description: テーブル名の翻訳結果 }
    items:
      type: array
      description: テーブルデータの翻訳結果。外側の配列が行、内側の配列がセルです。
      items:
        type: array
        items: { $ref: '#/CommonFieldTranslate' }
    item_headers:
      type: array
      description: テーブルヘッダーの翻訳結果
      items: { $ref: '#/TableFieldHeadTranslate' }

StampTranslateResult:
  type: object
  properties:
    key: { type: string, description: "stamp-${page}-${index} 形式の印影一意キー" }
    page: { type: integer, description: ページ番号 }
    index: { type: integer, description: ページ内の0始まりインデックス }
    stamp_prefix: { type: string, nullable: true, description: 印影プレフィックスの翻訳結果 }
    type_key: { type: string, nullable: true, description: 印影タイプ key の翻訳結果 }
    type: { type: string, nullable: true, description: 印影タイプの翻訳結果 }
    color_key: { type: string, nullable: true, description: 印影色 key の翻訳結果 }
    color: { type: string, nullable: true, description: 印影色の翻訳結果 }
    stamp_shape_key: { type: string, nullable: true, description: 印影形状 key の翻訳結果 }
    stamp_shape: { type: string, nullable: true, description: 印影形状の翻訳結果 }
    value_key: { type: string, nullable: true, description: 印影文字 key の翻訳結果 }
    value: { type: string, nullable: true, description: 印影文字の翻訳結果 }

HandwritingTranslateResult:
  type: object
  properties:
    key: { type: string, description: "handwriting-${page}-${lineIndex} 形式の手書き文字一意キー" }
    page: { type: integer, description: ページ番号 }
    index: { type: integer, description: ページ内の0始まりインデックス }
    handwriting_prefix: { type: string, nullable: true, description: 手書き文字プレフィックスの翻訳結果 }
    text: { type: string, nullable: true, description: 手書き文字の翻訳結果 }

DocumentParserParam:
  type: object
  properties:
    formula_level:
      type: integer
      description: "数式認識レベル（0: 表示数式とインライン数式を認識、1: 表示数式のみ認識、2: 数式を認識しない）"
      example: 0
    apply_merge:
      type: integer
      description: "ページをまたぐ段落とテーブルを結合（0: いいえ、1: はい）"
      example: 1
    table_text_split_mode:
      type: integer
      description: "テーブル罫線と交差するテキストブロックを分割（0: いいえ、1: はい）"
      example: 0
    crop_dewarp:
      type: integer
      description: "クロップと歪み補正（0: いいえ、1: はい）"
      example: 0
    remove_watermark:
      type: integer
      description: "透かし除去（0: いいえ、1: はい）"
      example: 0
    dpi:
      type: integer
      description: "ファイル解像度（144: デフォルト、216: 高精度）"
      example: 144
      enum:
        - 144
        - 216
    parse_mode:
      type: string
      description: |
        解析モード
        - `auto`: 自動（デフォルト）
        - `scan`: スキャン文書モード
        - `vlm`: VLM モード
      example: auto
      enum:
        - auto
        - scan
        - vlm
    pdf_pwd:
      type: string
      description: 暗号化 PDF ファイルを復号するための PDF パスワード

TokenResult:
  type: object
  properties:
    result:
      type: object
      properties:
        token:
          type: string
          description: iframe シナリオで使用する有効なトークン
          example: abcd
        expiry:
          type: integer
          description: "有効期限（エポックタイムスタンプ形式、単位: 秒）"
          example: 1700000000
